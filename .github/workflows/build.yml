# Builds the Rust binary for Linux, FreeBSD, Windows and macOS (x86-64, ARM64 and, where it exists, RISC-V)
# on every push/PR to master. Tests run on every target that can execute on its runner.
# Pushing a tag starting with "v" additionally creates a GitHub release with all builds.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built against musl: a fully static binary that runs on any distribution.
          # The ARM64 and RISC-V builds are cross-compiled with zig as the linker; they can't run
          # on the x86-64 runner, so only the native build runs the tests.
          - { os: ubuntu-24.04,  rid: linux-x64,     target: x86_64-unknown-linux-musl,     binary: rxmltv,     zig: false, test: true }
          - { os: ubuntu-24.04,  rid: linux-arm64,   target: aarch64-unknown-linux-musl,    binary: rxmltv,     zig: true,  test: false }
          - { os: ubuntu-24.04,  rid: linux-riscv64, target: riscv64gc-unknown-linux-musl,  binary: rxmltv,     zig: true,  test: false }
          - { os: windows-latest, rid: win-x64,       target: x86_64-pc-windows-msvc,        binary: rxmltv.exe, zig: false, test: true }
          - { os: windows-latest, rid: win-arm64,     target: aarch64-pc-windows-msvc,       binary: rxmltv.exe, zig: false, test: false }
          # macos-latest is an Apple Silicon runner; the x86-64 build is cross-compiled on it.
          - { os: macos-latest,   rid: macos-arm64,   target: aarch64-apple-darwin,          binary: rxmltv,     zig: false, test: true }
          - { os: macos-latest,   rid: macos-x64,     target: x86_64-apple-darwin,           binary: rxmltv,     zig: false, test: false }

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # zig comes from PyPI: cargo-zigbuild finds it as "python3 -m ziglang".
      - name: Install zig
        if: matrix.zig
        run: python3 -m pip install --break-system-packages ziglang

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        if: matrix.test
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (zig)
        if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: rxmltv-${{ matrix.rid }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  # GitHub has no FreeBSD runners, so this builds inside a FreeBSD VM on a Linux runner.
  # A binary built on FreeBSD 14 runs on 14.x and newer. The ARM64 VM is emulated and therefore slow.
  freebsd:
    name: build (freebsd-${{ matrix.rid }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: x64,   arch: x86_64,  test: true }
          - { rid: arm64, arch: aarch64, test: false }
    steps:
      - uses: actions/checkout@v5

      - name: Build in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          arch: ${{ matrix.arch }}
          usesh: true
          prepare: |
            pkg install -y rust
          run: |
            if [ "${{ matrix.test }}" = "true" ]; then cargo test; fi
            cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: rxmltv-freebsd-${{ matrix.rid }}
          path: target/release/rxmltv
          if-no-files-found: error

  # Runs only for tags like v1.0.0, after every build above has succeeded.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, freebsd]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts   # one sub-folder per artifact name, e.g. artifacts/rxmltv-linux-x64

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for folder in artifacts/rxmltv-*; do
            rid="${folder#artifacts/rxmltv-}"
            dir="rxmltv-$TAG-$rid"
            mkdir "$dir"
            cp "$folder"/rxmltv* "$dir/"
            if [[ "$rid" == win-* ]]; then
              zip -qr "dist/$dir.zip" "$dir"
            else
              # Artifacts lose the executable bit, so set it again before archiving.
              chmod +x "$dir/rxmltv"
              tar -czf "dist/$dir.tar.gz" "$dir"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
