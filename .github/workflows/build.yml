# Builds the Rust binary for Linux, FreeBSD, Windows and macOS (x86-64, ARM64 and, where they exist, RISC-V,
# 32-bit ARMv7 and MIPS little-endian) on every push/PR to main. Tests run on every target that can execute on its runner.
# Pushing a tag starting with "v" additionally creates a GitHub release with all builds, plus .deb and .rpm
# packages for Linux (x86-64, ARM64, ARMv7, RISC-V, mipsel).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    # An experimental target may fail without stopping the release (it is then simply left out).
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built against musl: a fully static binary that runs on any distribution.
          # The ARM64 and RISC-V builds are cross-compiled with zig as the linker; they can't run
          # on the x86-64 runner, so only the native build runs the tests.
          - { os: ubuntu-24.04,  rid: linux-x64,     target: x86_64-unknown-linux-musl,     binary: rxmltv,     zig: false, test: true }
          - { os: ubuntu-24.04,  rid: linux-arm64,   target: aarch64-unknown-linux-musl,    binary: rxmltv,     zig: true,  test: false }
          - { os: ubuntu-24.04,  rid: linux-riscv64, target: riscv64gc-unknown-linux-musl,  binary: rxmltv,     zig: true,  test: false }
          # 32-bit ARMv7 with hardware floating point (Raspberry Pi 2/3 and later with a 32-bit system, Debian armhf).
          - { os: ubuntu-24.04,  rid: linux-armv7,   target: armv7-unknown-linux-musleabihf, binary: rxmltv,   zig: true,  test: false }
          # mipsel has no prebuilt Rust standard library (a "tier 3" target), so it is built with nightly Rust and
          # -Zbuild-std. The result is a static soft-float binary, which also runs on MIPS CPUs with an FPU.
          - { os: ubuntu-24.04,  rid: linux-mipsel,  target: mipsel-unknown-linux-musl,     binary: rxmltv,     zig: true,  test: false, nightly: true, experimental: true }
          - { os: windows-latest, rid: win-x64,       target: x86_64-pc-windows-msvc,        binary: rxmltv.exe, zig: false, test: true }
          - { os: windows-latest, rid: win-arm64,     target: aarch64-pc-windows-msvc,       binary: rxmltv.exe, zig: false, test: false }
          # macos-latest is an Apple Silicon runner; the x86-64 build is cross-compiled on it.
          - { os: macos-latest,   rid: macos-arm64,   target: aarch64-apple-darwin,          binary: rxmltv,     zig: false, test: true }
          - { os: macos-latest,   rid: macos-x64,     target: x86_64-apple-darwin,           binary: rxmltv,     zig: false, test: false }

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        if: ${{ !matrix.nightly }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust (nightly, for -Zbuild-std)
        if: matrix.nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # zig comes from PyPI: cargo-zigbuild finds it as "python3 -m ziglang".
      - name: Install zig
        if: matrix.zig
        run: python3 -m pip install --break-system-packages ziglang

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        if: matrix.test
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (zig)
        if: ${{ matrix.zig && !matrix.nightly }}
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build (zig, build-std)
        if: matrix.nightly
        run: cargo zigbuild -Zbuild-std=std,panic_abort --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: rxmltv-${{ matrix.rid }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  # GitHub has no FreeBSD runners, so this builds inside a FreeBSD VM on a Linux runner.
  # A binary built on FreeBSD 14 runs on 14.x and newer. The ARM64 VM is emulated and therefore slow.
  freebsd:
    name: build (freebsd-${{ matrix.rid }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: x64,   arch: x86_64,  test: true }
          - { rid: arm64, arch: aarch64, test: false }
    steps:
      - uses: actions/checkout@v5

      - name: Build in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          arch: ${{ matrix.arch }}
          usesh: true
          prepare: |
            pkg install -y rust
          run: |
            if [ "${{ matrix.test }}" = "true" ]; then cargo test; fi
            cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: rxmltv-freebsd-${{ matrix.rid }}
          path: target/release/rxmltv
          if-no-files-found: error

  # Runs only for tags like v1.0.0, after every build above has succeeded.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, freebsd]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5   # for packaging/nfpm.yaml and the README

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts   # one sub-folder per artifact name, e.g. artifacts/rxmltv-linux-x64

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for folder in artifacts/rxmltv-*; do
            rid="${folder#artifacts/rxmltv-}"
            dir="rxmltv-$TAG-$rid"
            mkdir "$dir"
            cp "$folder"/rxmltv* "$dir/"
            if [[ "$rid" == win-* ]]; then
              zip -qr "dist/$dir.zip" "$dir"
            else
              # Artifacts lose the executable bit, so set it again before archiving.
              chmod +x "$dir/rxmltv"
              tar -czf "dist/$dir.tar.gz" "$dir"
            fi
          done

      # .deb and .rpm from the static Linux binaries. nfpm needs no Rust, only the binary and
      # packaging/nfpm.yaml; ARCH and VERSION fill in the variables in that file, and the executable
      # for each architecture is copied to build/rxmltv, the path the file lists.
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Linux packages (deb, rpm)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          export VERSION="${TAG#v}"
          # build id : nfpm architecture (deb armhf / rpm armv7hl for arm7, deb and rpm mipsel for mipsle)
          for pair in linux-x64:amd64 linux-arm64:arm64 linux-armv7:arm7 linux-riscv64:riscv64 linux-mipsel:mipsle; do
            rid="${pair%%:*}"
            export ARCH="${pair##*:}"
            if [ ! -f "artifacts/rxmltv-$rid/rxmltv" ]; then
              echo "::warning::no $rid build, so no packages for it"
              continue
            fi
            mkdir -p build
            cp "artifacts/rxmltv-$rid/rxmltv" build/rxmltv
            chmod +x build/rxmltv
            for format in deb rpm; do
              # one package that cannot be built must not stop the release
              if ! nfpm package --config packaging/nfpm.yaml --packager "$format" --target dist/; then
                echo "::warning::could not build the $format package for $ARCH"
              fi
            done
          done
          for deb in dist/*.deb; do dpkg-deb --info "$deb" | head -n 12; done

      - name: Checksums
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
